services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fpl_optimizer_test
      POSTGRES_USER: fpl_optimizer
      POSTGRES_PASSWORD: fpl_optimizer_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpl_optimizer -d fpl_optimizer_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
