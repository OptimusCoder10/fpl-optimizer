[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-optimizer-backend"
version = "0.1.0"
description = "Backend data and optimization services for FPL Optimizer"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.18,<2",
    "asyncpg>=0.31,<1",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0.45,<3",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "database: requires the Docker Compose PostgreSQL test database",
]

[tool.setuptools.packages.find]
where = ["src"]
